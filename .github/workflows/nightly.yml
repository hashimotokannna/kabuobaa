name: nightly-screener

on:
  schedule:
    # 平日 JST 9:40〜14:40 毎時 (= UTC 0:40〜5:40): 取引時間中の途中経過を記帳
    - cron: "40 0-5 * * 1-5"
    # 平日 JST 15:45 (= UTC 6:45): 大引け後の確定値を記帳
    - cron: "45 6 * * 1-5"
    # 平日 JST 20:30 (= UTC 11:30): 夜の確定記帳（入れ替えの基準）
    - cron: "30 11 * * 1-5"
  workflow_dispatch:      # 手動実行ボタンも有効化
    inputs:
      limit:
        description: "テスト用: 銘柄数を絞る（例: 50）。空欄なら全銘柄"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: スクリーニング実行
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          TEST_LIMIT: ${{ inputs.limit }}
        run: python screener.py

      - name: 結果をコミット
        run: |
          git config user.name "kabuobaa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "夜間記帳 $(date +'%Y-%m-%d')"
          git push
