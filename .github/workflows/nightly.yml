name: nightly-screener

on:
  schedule:
    # 平日 JST 9:40〜14:40 毎時 (= UTC 0:40〜5:40): 取引時間中の途中経過を記帳
    - cron: "40 0-5 * * 1-5"
    # 平日 JST 15:45 (= UTC 6:45): 大引け後の確定値を記帳
    - cron: "45 6 * * 1-5"
    # 平日 JST 20:30 (= UTC 11:30): 夜の確定記帳（入れ替えの基準）
    - cron: "30 11 * * 1-5"
  workflow_dispatch:      # 手動実行ボタンも有効化
    inputs:
      limit:
        description: "テスト用: 銘柄数を絞る（例: 50）。空欄なら全銘柄"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 前回の公開結果を引き継ぐ（NEW判定・選定履歴用）
        run: |
          git fetch origin pages 2>/dev/null && git checkout origin/pages -- docs || echo "pagesブランチはまだ無いので初回扱い"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: スクリーニング実行
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          JQUANTS_MAIL: ${{ secrets.JQUANTS_MAIL }}
          JQUANTS_PASSWORD: ${{ secrets.JQUANTS_PASSWORD }}
          JQUANTS_REFRESH_TOKEN: ${{ secrets.JQUANTS_REFRESH_TOKEN }}
          TEST_LIMIT: ${{ inputs.limit }}
        run: python screener.py

      - name: 結果を公開（pagesブランチを常に1コミットで上書き＝リポジトリが太らない方式）
        run: |
          git config user.name "kabuobaa-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan publish-tmp
          git reset
          git add -f docs
          git commit -m "publish $(date +'%Y-%m-%d %H:%M')"
          git push --force origin publish-tmp:pages
